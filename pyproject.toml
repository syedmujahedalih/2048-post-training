[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posttrain2048"
version = "0.1.0"
description = "A reproducible 2048 laboratory for supervised fine-tuning and online RL"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tokenizer = ["transformers>=4.45,<6", "huggingface-hub>=0.36"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
posttrain2048 = "posttrain2048.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
