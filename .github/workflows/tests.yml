name: Local lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.7"
          python-version: "3.11"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv run python scripts/build_teacher.py
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/audit_data.py
      - run: uv run posttrain2048 replay results/random-seed42.json
